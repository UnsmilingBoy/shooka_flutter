<!doctype html>
<html lang="fa">
  <head>
    <base href="$FLUTTER_BASE_HREF" />

    <meta charset="UTF-8" />
    <meta content="IE=Edge" http-equiv="X-UA-Compatible" />
    <meta name="description" content="A new Flutter project." />

    <!-- iOS meta tags & icons -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="shooka_flutter" />
    <link rel="apple-touch-icon" href="icons/Icon-192.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="icons/favicon.png?v=1" />

    <title>shooka_flutter</title>
    <link rel="manifest" href="manifest.json" />

    <!--
      Freshness strategy (see nginx.conf.example + WebUpdateBanner):
      - nginx serves index.html / flutter_bootstrap.js / main.dart.js /
        app_build.json with `Cache-Control: no-cache` so a normal F5
        always revalidates the entry points.
      - Hashed/static assets (canvaskit, assets/) are cached immutably.
      - The app polls app_build.json (cache-busted) and compares its
        `build_id` against the BUILD_ID baked in via --dart-define
        (see tool/build_web.dart). On mismatch it shows an update banner
        with a hard-reload button.
      Do NOT delete CacheStorage on every load here: that forces a full
      re-download (canvaskit ~5MB) on every visit and still does not fix
      HTTP caching of index.html itself. Targeted cleanup happens only
      when the user presses the update button (see web_update_service.dart).
    -->
    <script>
      // One-time legacy cleanup: unregister old Flutter service workers
      // left over from previous PWA builds. No-op when none exist.
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          for (var r of regs) {
            r.unregister();
          }
        });
      }
    </script>
  </head>
  <body>
    <script src="flutter_bootstrap.js" async></script>
  </body>
</html>
